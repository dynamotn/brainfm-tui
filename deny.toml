# cargo-deny: run `cargo deny check` (also in CI).

[graph]
all-features = false

[advisories]
# RustSec advisories: vulnerable and unmaintained crates fail the check.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only; anything else needs an explicit decision here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# This crate has no license yet and is not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A second TLS stack would double the crypto surface.
deny = [
    { crate = "openssl", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
