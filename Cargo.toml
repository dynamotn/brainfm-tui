[package]
name = "brainfm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3.34"
humantime = "2.4.0"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }
rodio = "0.23"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8"
stream-download = "0.24"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tui-big-text = "0.8"
url = "2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
