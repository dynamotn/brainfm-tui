[package]
name = "brainfm"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Unofficial terminal client for Brain.fm: a desktop-like TUI and a scriptable CLI"
repository = "https://github.com/dynamotn/brainfm-tui"
readme = "README.md"
keywords = ["brainfm", "tui", "music", "focus", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
directories = "6"
futures = "0.3.34"
humantime = "2.4.0"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }
rodio = "0.23"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stream-download = { version = "0.24", default-features = false, features = ["reqwest"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tui-big-text = "0.8"
url = "2"
zeroize = "1"

[features]
# Talk to PipeWire natively instead of through pipewire-pulse. Needs
# libpipewire >= 0.3.53 and clang at build time, and libpipewire at runtime,
# so release binaries leave it off.
pipewire = ["cpal/pipewire"]

[dev-dependencies]
insta = "1.49.0"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Enforced: an unwrap outside tests needs to become an `expect` with a reason.
unwrap_used = "warn"
dbg_macro = "warn"
# Allowed on purpose:
# - every fallible fn here returns anyhow::Result with context; an `# Errors`
#   section would only restate it.
missing_errors_doc = "allow"
# - `ui::player`, `player::PlayerCommand`… read better than shortened names.
module_name_repetitions = "allow"
# - usize→f64 only happens on terminal-sized counts (< 2^16), never lossy.
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["service", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
